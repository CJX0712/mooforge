name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check mooforge tests

      - name: Test (pytest)
        run: pytest -q

      - name: Deterministic smoke benchmark
        run: python -m mooforge.cli run --out smoke.json --n-evals 300 --pop-size 24 --n-seeds 2 --ablation-seeds 1

  # Extended benchmark with the optional SOTA backend (pymoo) installed.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with SOTA backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sota,dev]"
      - name: Full benchmark
        run: python -m mooforge.cli run --out benchmark.json
